name: Build FPK

# 两种触发方式：
#   1) 打 tag（v1.0.4 / 1.0.4）——自动打包并创建/更新 Release 并上传 .fpk 附件
#   2) 手动触发（workflow_dispatch）——只产出构建产物（Actions 页面下载 artifacts）
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Download fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          mkdir -p tools
          URL="${FNPACK_URL}"
          if [ -z "$URL" ]; then
            echo "::error::请在该仓库 Settings → Variables 中配置 FNPACK_URL（飞牛官方 fnpack 的 Linux 可执行文件下载地址）"
            exit 1
          fi
          curl -fL --retry 3 -o tools/fnpack "$URL"
          chmod +x tools/fnpack
          tools/fnpack --help >/dev/null 2>&1 || true

      - name: Read version from manifest
        id: ver
        run: |
          VERSION=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $VERSION"

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pytest -q test_web_api.py test_regressions.py test_tag_engine.py --no-header

      - name: Build FPK
        run: python build_official_fpk.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicTagNative-${{ steps.ver.outputs.version }}
          path: MusicTagNative-${{ steps.ver.outputs.version }}.fpk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MusicTagNative-${{ steps.ver.outputs.version }}.fpk
          name: v${{ steps.ver.outputs.version }} · 飞牛 MusicTag Native
          generate_release_notes: true
          fail_on_unmatched_files: true
